name: Flutter CI

on:
  push:
    branches:
      - main
      - github-actions
  pull_request:
    branches:
      - main
     

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.4  # Update to your Flutter version

      - name: Install dependencies
        run: flutter clean
        run: flutter pub get

      # - name: Run tests
      #   run: flutter test

      - name: Build APK
        run: flutter build apk 
